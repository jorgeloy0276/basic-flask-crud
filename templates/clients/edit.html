{% extends 'base.html' %}


{% block content %}


<div class="bg-white p-6 rounded-xl shadow-lg max-w-lg mx-auto">


    <h1 class="text-2xl font-bold mb-5">

        Editar Cliente </h1>


    <form method="POST">


        <input

                type="text"

                name="name"

                value="{{ client[1] }}"

                class="w-full border p-3 mb-3 rounded"

        >


        <input

                type="email"

                name="email"

                value="{{ client[2] }}"

                class="w-full border p-3 mb-3 rounded"

        >


        <input

                type="text"

                name="phone"

                value="{{ client[3] }}"

                class="w-full border p-3 mb-3 rounded"

        >


        <button

                class="bg-yellow-500 text-white px-5 py-3 rounded-lg">


            Actualizar


        </button>
         <a href="/"
           class="bg-red-600 text-white px-5 py-3 rounded-lg"> Cancelar
         </a>



    </form>



</div>


{% endblock %}}
